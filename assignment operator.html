<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
         var a = 10;
        document.write((a)+"<br>");
        a+=10;
        document.write((a)+"<br>");
        a-=10;
        document.write((a)+"<br>");
        a*=2;
        document.write((a)+"<br>");
        a/=5;
        document.write((a)+"<br>");
        a%=2;
        document.write((a)+"<br>");
        a**=2;
        document.write((a)+"<br>");
    </script>
</body>
</html>
