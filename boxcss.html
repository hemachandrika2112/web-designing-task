<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
<style>
    *{
        padding: 0;
        margin: 0;
        font-family: "Open+Sans";
    }
    .box{
        margin: 20px;
        width: 300px;
        height: 400px;
        border: 1px solid rgb(160,156,156);
        box-shadow: 5px 5px 5px rgb(148,146,146);
    }    
    .box .box1 {
        width: 300px;
        height: 180px;
        /* background-color: blue; */
    }
    .box .box1 img {
        width: 300px;
        height: 180px;
    }
    .box .box2 {
        width: 300px;
        height: 220px;
   }
   .box .box2 h1,p,h3,h2 {
        padding-left: 16px;
        padding-top: 16px;
        font-size: 16px;
   }
   .box .box2 p{
    text-shadow: 1px 1px 4px rgb(131, 130, 130);
    padding-top: 4px;
    font-size: 12px;
   }
   .box .box2 hr{
    margin: 15px 18px 5px;
    border: 1px solid rgba(145,133,89,0.518);
   }
   .box .box2 h2{
    color: rgb(117,92,66);
    letter-spacing: 1px;
    font-size: 14px;
    padding-bottom: 0;
   }
   .box .box2 h3{
    color: rgb(0,0,0);
    letter-spacing: 1px;
    font-size: 12px;
    padding-top: 2px;
    padding-bottom: 0;
   }
</style>
</head>
<body>
    <div class="box">
        <div class="box1"><img src="image/natural1.jpg" alt="">
    </div>
    <div class="box2">
        <h1>Lorem ipsum</h1>
        <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Eligendi quita delectus laudantium magni rem
            praesentium corporis nihil In nulla doloremque magnam.
        </p>
        <hr>
        <h2>AUTHOR</h2>
        <h3>JOHN DEO</h3>
    </div>
    </div>
</body>
</html>
