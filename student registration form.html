<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form>
        <h3 style= "color: red">
            <type style="text-align: center;">
            <legend>Student Registration Form</legend></type></h3><br>
            <label>Roll no.:</label>
            <td><input type="text"></td><br>
            <label>Student name :</label>
            <input type="text" placeholder="First Name">
            <input type="text" placeholder="Last Name"><br>
            <label>Father's Name:</label>
            <td><input type="text"></td><br>
            <label>Date of birth :</label>
            <input type="date"><br>
            <label>Mobile No.:</label>
            <input type="text"><br>
            <label>Email id :</label>
            <input type="text"><br>
            <label>Password :</label>
            <input type="text"><br>
            <label>Gender :</label>
            <input type="radio" name="0">Male
            <input type="radio" name="0">Female<br>
            <label>Department :</label>
            <input type="checkbox">CSE 
            <input type="checkbox">IT
            <input type="checkbox">ECE
            <input type="checkbox">Civil
            <input type="checkbox">Mech<br>
            <label>Course :</label>
            <select>
                <option>Select an option</option>
                <option>B.E</option>
                <option>B.Tech</option>
            </select><br>
            <label>Student photo :</label>
            <input type="file"><br>
            <label>City :</label>
            <input type="text"><br>
            <label>Address :</label>
            <input type="text"><br>
            <input type="button" value="Register"><br>
    </form>
</body>
</html>
