<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        ul{
            list-style-type: none;
            display: flex;
            /* padding: 10px; */
        }
        li{
            position: relative;
            top: 10px;
            width: 40px;
            height: 30px;
            text-align: center;
            padding-top: 10px;
            /* padding: 10px; */
            border: 2px solid black;
        }
        li:hover{
            position: relative;
            top: 5px;
            border: 2px solid green;
            width: 50px;
            height: 40px;
            padding-top: 15px;
        }
    </style>
</head>

<body>
    <ul>
        <li>1</li>
        <li>2</li>
        <li>3</li>
        <li>4</li>
        <li>5</li>
        <li>6</li>
        <li>7</li>
        <li>8</li>
        <li>9</li>
        <li>10</li>
    </ul>
</body>

</html>
