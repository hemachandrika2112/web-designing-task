<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title> 
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-..." crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
        h1{
            color: darkred;
        }
        @media screen and (max-width:356px) {
            h1{
                background: #000;
                color: aliceblue;
            }
        }
        @media screen and (min-width:357px) and (max-width:767px) {
            h1{
                background: #ff0000;
                color: rgb(255, 255, 255);
            }
        }
        @media screen and (min-width:768px) and (max-width:1200px) {
            h1{
                background: #000408;
                color: rgb(255, 255, 255);
            }
        }
        @media screen and (min-width:1201px) {
            h1{
                background: #e5e0e0;
                color: rgb(156, 7, 7);
            }
        }
    </style>
</head>
