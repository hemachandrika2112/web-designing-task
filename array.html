<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        const a = [2, 5, 6];
        document.write(typeof (a));
        document.write(a);
        const y = new Array(5);
        document.write(typeof (y));
        y[0] = 5;
        y[1] = 3;
        y[2] = 4;
        y[3] = 7;
        y[4] = 9;
         document.write(y);
        document.write(y[0]);
        for (let i = 0; i < y.length; i++) {
            document.write(y[i]);
        }




        //sum of elements of an array
        let sum = 0;
        for (let i = 0; i < y.length; i++) {
            sum += y[i];
        }
        document.write(sum);

    </script>
</body>
</html>
