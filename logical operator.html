<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        var a = 10;
        var b = 20;
        var c = 30;
        document.write(a>b && a>c);
        document.write("<br>");
        document.write(b>c && b>a);
        document.write("<br>");
        document.write(c>a && c>b);
        document.write("<br>");
        document.write(c==a || c>a);
        document.write("<br>");
        document.write(!(a==c));
        document.write("<br>");
    </script>
</body>
</html>
