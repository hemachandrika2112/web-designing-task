<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Document</title>
    <style>
        * {
            margin: 0;

        }
        button{

            font-size: 16px;
            background-color: #e6edea;
            border: 2px solid #cbcfcd;
            margin-left: 45%;
            margin-top: 20px;
        }
        button:hover{
            border: 2px solid #aeb2b0;
            cursor: pointer;
            /* background-color: #fff; */
        }
    </style>
</head>
