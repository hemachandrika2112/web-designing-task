<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box{
            width: 100px;
            height: 100px;
            /* background-color: rgb(241, 120, 120); */
            /* border-radius: 20%; */
            animation-name: task;
            animation-duration: 2s;
            animation-iteration-count: infinite;
            border-radius: 50%;
            animation-delay: 1s;
        }
        
        @keyframes task {
            from{
                position: relative;
                top: 0;
                left: 0;
                background-color: rgb(2, 244, 172);
            }
            to{
                position: relative;
                top: 0;
                left: 500px;
                background-color: #016342;
                
            }
        }
        .box1{
            width: 100px;
            height: 100px;
            /* background-color: rgb(241, 120, 120); */
            /* border-radius: 20%; */
            animation-name: task1;
            animation-duration: 1s;
            animation-iteration-count: infinite;
            border-radius: 50%;
            /* animation-delay: 1s; */
        }
         @keyframes task1 {
            from{
               
                background-color: rgba(2, 244, 171, 0);
            }
            to{
                
                background-color: rgb(80, 11, 81);
                /* border: 1px solid rgb(27, 26, 26); */
                
            }
        }

        .shape1{
            width: 80px;
            height: 80px;
            background-color: rgb(255,255,255);
            /* border-radius: 20%; */
            animation-name: task2;
            animation-duration: 5s;
            animation-iteration-count: infinite;
            border-radius: 50%;
            /* animation-delay: 1s; */
        }
        @keyframes task2 {
            0%{
                position: relative;
                top: 0;
                left: 0;
                background-color: #FFB7C5;
                border-radius: 50%;
            }
            17.5%{
                background-color:#FFD1DC;
                border-radius: 25%;
            }
            25%{
                position: relative;
                top: 0px;
                left: 250px;
                background-color:#FFB5C0;
                border-radius: 50%;
            }
            37.5%{
                background-color:#FFD1DC;
                border-radius: 25%;
            }
            50%{
                position: relative;
                left: 250px;
                top: 250px;
                background-color:#FFC0CB;
                border-radius: 50%;
            }
            67.5%{
                background-color:#E89EB8;
                border-radius: 25%;
            }
            75%{
                position: relative;
                top: 250px;
                left: 0;
                background-color: #FBAED2;
                border-radius: 50%;
            }
            87.5%{
                background-color:#FF69B4;
                border-radius: 25%;
            }
            100%{
                position: relative;
                top: 0;
                border-radius: 50%;
                left: 0;
                background-color: #FF007F;
            }
        }
        .shape2{
            width: 80px;
            height: 120px;
            background-color: rgb(154, 22, 22);
            /* border-radius: 20%; */
            animation-name: task3;
            animation-duration: 5s;
            animation-iteration-count: infinite;
            border-radius: 100% 100% 50px 50px;
            /* animation-delay: 1s; */
            margin: 20px;
        }
        @keyframes task3 {
            0%{
                position: absolute;
                top: 0;
                left: 0;
            }
            50%{
                position: absolute;
                top: 0;
                left: 50px;
                /* transform: rotateZ(180deg); */
                /* transform: scaleY(20deg); */
            }
            100%{
                position: absolute;
                top: 0;
                left: 50px;
            }
        }
        .shape3{
            width: 200px;
            height: 200px;
            background-color: red;
            transition: width 5s, height 2s, transform 2s;
            
        }
        .shape3:hover{
            width: 220px;
            height: 220px;
            /* transform: smooth;
         transform:scaleX(20px);    */
        }
    </style>
</head>
