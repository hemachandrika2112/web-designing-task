<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        var paymentGateway=prompt("Enter the Application To Pay");
        switch(paymentGateway)
        {
            case "gpay":
                alert("Gpay Is Valid to Pay");
                break;
            case "phonepe":
                alert("Phonepe Is Valid to Pay");
                break;
            case "amazonpay":
                alert("Amazonpay Is Valid to Pay");
                break;
            case "paytm":
                alert("Paytm Is Valid to Pay");
                break;
            case "applepay":
                alert("Applepay Is Valid to Pay");
                break;
            default:
                alert("Invalid Option");
        }
    </script>
</body>
</html>
