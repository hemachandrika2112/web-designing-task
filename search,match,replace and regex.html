         <script>
        const searchTerm = "apple";
        // Matches the word "apple" globally and case-insensitively
        const regex = new RegExp(`\\b${searchTerm}\\b`, "gi");

        const text = "I like Apple pie and green apple juice.";
        document.write(text.match(regex));

        // Output: ["Apple", "apple"]


        // Pattern: Minimum 8 characters, at least one letter and one number
const passwordRegex = new RegExp("^(?=.*[A-Za-z])(?=.*\\d)[A-Za-z\\d]{8,}$");

document.write(passwordRegex.test("Pass1234")); // true
document.write(passwordRegex.test("password")); // false (missing number)
document.write(passwordRegex.test("Pass1"));    // false (too short)

// • ^ and $. Anchor the pattern to the start and end of the string so the entire password is checked.
// • (?=.*[A-Za-z]). A positive lookahead ensuring at least one uppercase or lowercase letter exists anywhere in the string.
// • (?=.*\\d). A positive lookahead ensuring at least one digit (0-9) exists.
// • [A-Za-z\\d]{8,}. Matches the allowed characters (letters and numbers) and enforces a minimum length of 8.

    </script>
