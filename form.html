<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form>
        <fieldset>
            <legend>PersonalDetails</legend>
            <label>Name :</label>
            <input type="text" placeholder="Enter Your Name"><br>
            <label>Age :</label>
            <input type="number" max="50" min="10"><br>
            <label>Fav color :</label>
            <input type="color"><br>
            <label>Resume :</label>
            <input type="file"><br>
            <label>Skills :</label>
            <input type="checkbox">Python
            <input type="checkbox">Java
            <input type="checkbox">Web Design
            <input type="checkbox">C++ <br>
            <label>Gender :</label>
            <input type="radio" name="0">Male
            <input type="radio" name="0">Female<br>
            <label>Location :</label>
            <input type="date"><br>
            <label>Comment :</label>
            <textarea placeholder="Add a comment"></textarea>
        </fieldset>
        <button>Submit</button>
    </form>
</body>
</html>
